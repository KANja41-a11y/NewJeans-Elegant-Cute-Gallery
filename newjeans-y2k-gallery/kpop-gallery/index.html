<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewJeans Y2K Gallery 💿</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Floating decorations -->
  <div class="decorations">
    <span class="star">★</span>
    <span class="star">♡</span>
    <span class="star">★</span>
    <span class="star">♡</span>
    <span class="star">★</span>
    <span class="star">♡</span>
  </div>

  <!-- Header -->
  <header>
    <div class="container">
      <div class="logo-y2k">
        <span class="glitter">✧</span>
        NewJeans
        <span class="glitter">✧</span>
      </div>
      <h1>Y2K Fan Gallery</h1>
      <p class="subtitle">minji • hanni • danielle • haerin • hyein</p>
    </div>
  </header>

  <!-- Music Player -->
  <div class="music-player">
    <button id="playBtn" class="music-btn">▶ Play Ditto</button>
    <div class="music-info">
      <span class="song-title">♪ Ditto - NewJeans</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.4" title="Volume">
    </div>
  </div>

  <p class="music-note">⚠️ Taruh file <strong>ditto.mp3</strong> di folder yang sama biar musiknya nyala ya</p>

  <!-- Gallery -->
  <main class="gallery container" id="gallery">
    <!-- Cards generated by JS -->
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close">×</span>
    <img src="" alt="Full size" id="lightbox-img">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <footer>
    <p>💿 NewJeans Y2K Gallery • Made with ♡ for Bunnies</p>
  </footer>

  <!-- Background music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="ditto.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
